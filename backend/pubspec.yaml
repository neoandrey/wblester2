name: wblester
description: >-
  WBLester content-management system admin portal (Flutter Web).
  A stateless JSON client for the CMS WebApi: pages + block editor,
  categories, messages, settings, users, roles matrix, scheduler
  (events/jobs) and system diagnostics.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg